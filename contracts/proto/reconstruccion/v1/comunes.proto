syntax = "proto3";

package reconstruccion.v1;

option csharp_namespace = "Reconstruccion.Contratos.V1";

// Tipos compartidos por los contratos gRPC.
// Los valores 0 significan no especificado.
// El adaptador valida los valores antes de convertirlos al dominio.

enum EstadoPlanGrpc {
  ESTADO_PLAN_NO_ESPECIFICADO = 0;
  ESTADO_PLAN_ABIERTO = 1;
  ESTADO_PLAN_COMPLETADO = 2;
  ESTADO_PLAN_CERRADO = 3;
}

enum EstadoProyectoGrpc {
  ESTADO_PROYECTO_NO_ESPECIFICADO = 0;
  ESTADO_PROYECTO_PROPUESTO = 1;
  ESTADO_PROYECTO_APROBADO = 2;
  ESTADO_PROYECTO_RECHAZADO = 3;
  ESTADO_PROYECTO_EN_EJECUCION = 4;
  ESTADO_PROYECTO_SUSPENDIDO = 5;
  ESTADO_PROYECTO_CANCELADO = 6;
  ESTADO_PROYECTO_FINALIZADO = 7;
}

enum EstadoNecesidadGrpc {
  ESTADO_NECESIDAD_NO_ESPECIFICADO = 0;
  ESTADO_NECESIDAD_PENDIENTE = 1;
  ESTADO_NECESIDAD_ASIGNADA = 2;
  ESTADO_NECESIDAD_ATENDIDA = 3;
  ESTADO_NECESIDAD_DESCARTADA = 4;
}

enum TipoAlertaGrpc {
  TIPO_ALERTA_NO_ESPECIFICADO = 0;
  TIPO_ALERTA_SOBRECOSTO = 1;
  TIPO_ALERTA_HITO_VENCIDO = 2;
  TIPO_ALERTA_ORIGEN_MODIFICADO = 3;
}

enum EstadoAlertaGrpc {
  ESTADO_ALERTA_NO_ESPECIFICADO = 0;
  ESTADO_ALERTA_ACTIVA = 1;
  ESTADO_ALERTA_RESUELTA = 2;
}

enum TipoDocumentoGrpc {
  TIPO_DOCUMENTO_NO_ESPECIFICADO = 0;
  TIPO_DOCUMENTO_ACTA_ENTREGA = 1;
  TIPO_DOCUMENTO_CONTRATO = 2;
  TIPO_DOCUMENTO_ADMINISTRATIVO = 3;
  TIPO_DOCUMENTO_OTRO = 4;
}

enum TipoProyectoGrpc {
  TIPO_PROYECTO_NO_ESPECIFICADO = 0;
  TIPO_PROYECTO_RECUPERACION = 1;
  TIPO_PROYECTO_RECONSTRUCCION = 2;
}

enum EstadoCambioPresupuestalGrpc {
  ESTADO_CAMBIO_PRESUPUESTAL_NO_ESPECIFICADO = 0;
  ESTADO_CAMBIO_PRESUPUESTAL_SOLICITADO = 1;
  ESTADO_CAMBIO_PRESUPUESTAL_APROBADO = 2;
  ESTADO_CAMBIO_PRESUPUESTAL_RECHAZADO = 3;
  ESTADO_CAMBIO_PRESUPUESTAL_ANULADO = 4;
}

enum RolGrpc {
  ROL_NO_ESPECIFICADO = 0;
  ROL_RESPONSABLE = 1;
  ROL_AUTORIDAD = 2;
  ROL_AUDITOR = 3;
  ROL_CARACTERIZACION = 4;
  ROL_SISTEMA = 5;
}

// Equivale a ResultadoOperacion de Aplicacion.
enum ResultadoOperacionGrpc {
  RESULTADO_OPERACION_NO_ESPECIFICADO = 0;
  RESULTADO_OPERACION_EXITOSO = 1;
  RESULTADO_OPERACION_RECHAZADO = 2;
}
